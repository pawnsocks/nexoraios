name: Build Nexora IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1)"
        required: true
        default: "1.1.0"
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install project generator
        run: brew install xcodegen

      - name: Build unsigned IPA
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          NEXORA_BUILD: ${{ github.run_number }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            export NEXORA_VERSION="$INPUT_VERSION"
          elif [[ "$TAG_NAME" == v* ]]; then
            export NEXORA_VERSION="${TAG_NAME#v}"
          else
            export NEXORA_VERSION="1.1.0"
          fi
          bash ios/scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-unsigned-${{ github.run_number }}
          path: ios/build/Nexora-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
