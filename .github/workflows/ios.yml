name: Build Nexora IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install project generator
        run: brew install xcodegen

      - name: Build unsigned IPA
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          NEXORA_BUILD: ${{ github.run_number }}
        run: |
          export NEXORA_VERSION="${INPUT_VERSION:-${TAG_NAME#v}}"
          bash scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-unsigned-${{ github.run_number }}
          path: build/Nexora-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
